name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck monorepo workspaces
        run: npm run typecheck

      - name: Lint server workspace
        run: npm run lint --workspace=@kerala-tourism/server

      - name: Lint mobile workspace
        run: npm run lint --workspace=@kerala-tourism/mobile

  test-server:
    name: Server Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test database isolation & safety guard tests
        run: node --import tsx --test server/src/tests/test-database-guard.test.ts

      - name: Run server health & probe tests
        run: node --import tsx --test server/src/tests/health.test.ts

      - name: Run cross-module security & OWASP Top 10 tests
        run: node --import tsx --test server/src/tests/cross-module-security.test.ts

      - name: Run reliability & concurrency tests
        run: node --import tsx --test server/src/tests/reliability-concurrency.test.ts

      - name: Run end-to-end user journeys
        run: node --import tsx --test server/src/tests/e2e-user-journeys.test.ts

      - name: Run performance benchmark & index audit
        env:
          TEST_MONGO_URL: mongodb://127.0.0.1:27017/kerala_perf_benchmark_test
          TEST_MONGO_ALLOWED_HOSTS: 127.0.0.1,localhost
          REQUIRE_LIVE_MONGO: 'true'
        run: node --import tsx --test server/src/tests/day-28-performance-benchmark.test.ts

  test-mobile:
    name: Mobile Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run mobile unit & integration tests
        run: npm run test:mobile

  build-artifacts:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [test-server, test-mobile]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build server production bundle
        run: npm run build:server

      - name: Build Next.js web application
        run: npm run build --workspace=@kerala-tourism/web
        env:
          NEXT_PUBLIC_API_URL: https://api.keralatourism.local/api/v1
          NEXT_PUBLIC_APP_ENV: production

  security-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run npm audit (high/critical alerts)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
